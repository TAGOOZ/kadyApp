<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="none"/>
  <!-- Heritage Hearth lightweight pattern — sparse dots, 0.12 primary, replaces 1.7M 4442-path Adobe export -->
  <defs>
    <pattern id="hearth" patternUnits="userSpaceOnUse" width="48" height="48" patternTransform="rotate(15)">
      <circle cx="12" cy="12" r="1.8" fill="#003A2A" fill-opacity="0.12"/>
      <circle cx="36" cy="36" r="1.2" fill="#003A2A" fill-opacity="0.08"/>
      <path d="M0 24 Q12 22 24 24 T48 24" stroke="#003A2A" stroke-opacity="0.06" stroke-width="0.8" fill="none"/>
    </pattern>
  </defs>
  <rect width="500" height="500" fill="url(#hearth)"/>
</svg>
